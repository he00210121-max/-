name: update seafood prices
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "updater.py"
      - "requirements.txt"
      - ".github/workflows/update-prices.yml"
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python updater.py
      - name: commit data when changed
        run: |
          git config user.name "seafood-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: refresh seafood prices"
          git pull --rebase origin main
          git push origin main
